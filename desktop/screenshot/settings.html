<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'">
<title>截图设置</title><link rel="stylesheet" href="settings.css"></head>
<body><main><h1>截图与快捷键</h1><p>截取鼠标所在的整块屏幕，复制到剪贴板后可直接粘贴。</p>
<form id="settings"><label class="toggle"><input id="enabled" type="checkbox">启用全局截图快捷键</label>
<label for="accelerator">截图快捷键</label><input id="accelerator" autocomplete="off" spellcheck="false" maxlength="100" aria-describedby="shortcut-help">
<small id="shortcut-help">点击输入框后按下组合键。快捷键和启停状态在 HOTPOOR 应用间同步，后台运行时也可使用。</small>
<label for="priority" class="priority-label">当前应用接管优先级</label><input id="priority" type="number" min="0" max="1000" step="1" required>
<small>数字越大越优先，默认 Director 100、SayAgain 50。负责监听的应用退出后，其他应用自动接管。</small><p id="owner" role="status"></p>
<div class="actions"><button type="submit" id="save">保存快捷键</button><button type="button" id="capture">立即截图</button></div></form>
<p id="status" role="status" aria-live="polite"></p><p class="note">仅监听所设组合键。图片保留在本机剪贴板，不自动发送。截图会覆盖剪贴板现有内容。</p></main><script src="settings.js"></script></body></html>
